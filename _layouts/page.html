---
layout: default
---

<section class="page-hero shell narrow-shell">
  {% if page.eyebrow %}
    <p class="eyebrow">{{ page.eyebrow }}</p>
  {% else %}
    <p class="eyebrow">PROJECT CASE STUDY</p>
  {% endif %}

  <h1>{{ page.title }}</h1>

  {% if page.description %}
    <p class="page-lead">
      {{ page.description }}
    </p>
  {% endif %}
</section>

<article class="prose shell narrow-shell">
  {{ content }}
</article>
