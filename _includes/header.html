<header class="site-header">
  <div class="nes-container is-rounded blue-border header profile-card">
    <a class="avatar-link" href="{{ '/' | relative_url }}" aria-label="回到首页">
      <img class="profile-avatar" src="{{ '/assets/images/github-avatar.png' | relative_url }}" width="88" height="88" alt="KaiDecker 的 GitHub 头像">
    </a>
    <p class="site-name"><a href="{{ '/' | relative_url }}">KaiDecker</a></p>
    <p class="profile-note">在读学生。喜欢游戏，也弹吉他。</p>
    <div class="social-links">
      <a href="{{ site.author.github }}" target="_blank" rel="noreferrer" aria-label="KaiDecker 的 GitHub"><i class="nes-icon github is-small" aria-hidden="true"></i> GitHub</a>
      <a href="mailto:{{ site.author.email }}"><i class="nes-icon gmail is-small" aria-hidden="true"></i> Email</a>
    </div>
  </div>
  <nav class="site-nav" aria-label="主导航">
    <a class="nes-btn{% if page.url contains '/about' %} is-primary{% endif %}" href="{{ '/about/' | relative_url }}" {% if page.url contains '/about' %}aria-current="page"{% endif %}>About</a>
    <a class="nes-btn{% if page.url contains '/posts' %} is-primary{% endif %}" href="{{ '/posts/' | relative_url }}" {% if page.url contains '/posts' %}aria-current="page"{% endif %}>Posts</a>
    <a class="nes-btn{% if page.url contains '/projects' %} is-primary{% endif %}" href="{{ '/projects/' | relative_url }}" {% if page.url contains '/projects' %}aria-current="page"{% endif %}>Projects</a>
    <a class="nes-btn{% if page.url contains '/coursework' %} is-primary{% endif %}" href="{{ '/coursework/' | relative_url }}" {% if page.url contains '/coursework' %}aria-current="page"{% endif %}>Course</a>
  </nav>
</header>
